[project]
name = "name"
version = "0.3"
authors = [
  { name="Thorsten Hohage", email="hohage@math.uni-goettingen.de" },
]
description = "A python library to solve Inverse and Ill-Posed problems by regularization"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.14,<2.0", 
    "scipy>=1.12,<2.0", 
    "pooch>=1.8,<2.0",
    "pytest>=8.0,<9.0"
]

[project.urls]
Homepage = "https://num.math.uni-goettingen.de/regpy/"

[project.optional-dependencies]
ngsolve = ["ngsolve>=6.2.2404.post2"]

[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["regpy"]

